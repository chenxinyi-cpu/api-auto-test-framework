name: API Auto Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  smoke-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start FastAPI mock backend
        run: |
          nohup python -m mock_server.main > backend.log 2>&1 &
          echo "Waiting for backend..."
          for i in {1..15}; do
            if curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8000/docs | grep -q 200; then
              echo "Backend is ready"
              break
            fi
            echo "Attempt $i: backend not ready, waiting..."
            sleep 2
          done
          curl -f http://127.0.0.1:8000/docs || (echo "Backend failed to start" && cat backend.log && exit 1)

      - name: Run smoke tests
        run: |
          pytest -m smoke -v --alluredir=reports/allure-results

      - name: Upload Allure results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: reports/allure-results/